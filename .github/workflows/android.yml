name: Android build

# Builds the Calibre Android app. With signing secrets set it produces a signed
# Play Store bundle (.aab) and APK; without them, a debug APK for testing.
# Secrets (repo Settings → Secrets and variables → Actions):
#   CALIBRE_KEYSTORE_BASE64   base64 of calibre-upload.jks
#   CALIBRE_KEYSTORE_PASSWORD, CALIBRE_KEY_ALIAS, CALIBRE_KEY_PASSWORD
on:
  workflow_dispatch:
    inputs:
      versionCode: { description: 'versionCode (must increase for every Play upload)', required: true, default: '1' }
      versionName: { description: 'versionName shown to users', required: true, default: '1.0.0' }
  push:
    paths: ['android/**', 'js/**', 'css/**', 'index.html', 'fonts/**', 'icons/**', '.github/workflows/android.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: Restore signing key
        env: { KS: '${{ secrets.CALIBRE_KEYSTORE_BASE64 }}' }
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"; echo "CALIBRE_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"; echo "SIGNED=1" >> "$GITHUB_ENV"; fi
      - name: Build
        env:
          CALIBRE_KEYSTORE_PASSWORD: ${{ secrets.CALIBRE_KEYSTORE_PASSWORD }}
          CALIBRE_KEY_ALIAS: ${{ secrets.CALIBRE_KEY_ALIAS }}
          CALIBRE_KEY_PASSWORD: ${{ secrets.CALIBRE_KEY_PASSWORD }}
        run: |
          VC="${{ github.event.inputs.versionCode || github.run_number }}"; VN="${{ github.event.inputs.versionName || '1.0.0' }}"
          if [ -n "$SIGNED" ]; then ./gradlew --no-daemon bundleRelease assembleRelease -PversionCode="$VC" -PversionName="$VN"
          else ./gradlew --no-daemon assembleDebug -PversionCode="$VC" -PversionName="$VN"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: calibre-android
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
