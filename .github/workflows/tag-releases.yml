name: Tag releases

# Creates git tags vX.Y.Z (restore points) from CHANGELOG.md and version.json
# after each push to the release branches, so every version can be rolled back to.
on:
  push:
    branches: [main, master, 'ccr-*']
    paths: ['version.json', 'CHANGELOG.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          scripts/tag-releases.sh
          # push one by one: GitHub refuses the bot tags on commits whose workflow files
          # differ from today's (security rule). Those versions remain restorable via the
          # commit hash in CHANGELOG.md (scripts/rollback.sh), or push them from a PC.
          for t in $(git tag -l 'v*'); do
            git ls-remote --exit-code --tags origin "refs/tags/$t" >/dev/null && continue
            git push origin "refs/tags/$t" || echo "::warning::Could not create $t from Actions — run scripts/tag-releases.sh && git push origin --tags on a computer, or roll back with scripts/rollback.sh $t (uses the CHANGELOG hash)."
          done
