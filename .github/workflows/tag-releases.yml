name: Tag releases

# Creates git tags vX.Y.Z (restore points) from CHANGELOG.md and version.json
# after each push to the release branches, so every version can be rolled back to.
on:
  push:
    branches: [main, master, 'ccr-*']
    paths: ['version.json', 'CHANGELOG.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          scripts/tag-releases.sh
          git push origin --tags
